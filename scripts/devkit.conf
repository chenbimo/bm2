# 本项目的业务声明:骨架(scripts/devkit/**)读它,项目只维护这一处。
# 骨架里所有会因项目而异的地方都从这里取值,所以「统一」与「特殊」互不打扰。
# 每一项都对应骨架上的一个空格,填你项目的真实值;留空表示没有这项能力。

# 提交格式里的项目名:[<名称>](类型) 提交内容
DEVKIT_NAME="bm2"

# moon test -p 用的模块名(取自 moon.mod 的 name);留空则不带 -p。
DEVKIT_MODULE="chensuiyi/bm2"

# 源码目录前缀:只有改到它或 moon.mod 时才跑编译门。
DEVKIT_SRC="src/"

# verify 要跑测试的 target 列表。
DEVKIT_TARGETS="native"

# verify 要构建的入口,每行一条 moon build 参数。
DEVKIT_BUILDS="src/cmd/bm2 src/cmd/bm2d --target native"

# 启用的校验器(实现见 scripts/devkit/lib/checks.sh)。
DEVKIT_CHECKS="version_sync package_metadata toolchain_pin"

# 需要比对版本号时,写版本常量所在文件;不需要留空。
DEVKIT_VERSION_FILE="src/cmd/bm2/version.mbt"

# 跑命令前要导出的环境变量,空格分隔,如 "BM2_LANG=en"。
DEVKIT_ENV="BM2_LANG=en"

# 慢测试插槽:--with-e2e 时跑这个脚本的相对路径,没有留空。
DEVKIT_E2E="scripts/e2e/gate.sh"

# soak 插槽:--release 时在 e2e 之后跑,没有留空。
DEVKIT_SOAK="scripts/soak.sh"

# 发布流水线:bin 有编译产物(构建 + GitHub Release + moon publish),library 只发 mooncakes。
# bm2 只经 `moon install` 分发源码包,不挂 GitHub Release 资产,所以走 library。
DEVKIT_RELEASE="library"
