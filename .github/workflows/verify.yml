name: verify

# 门禁范围:format → lint(严格 check) → test → 增量构建,实现只有一份 ——
# scripts/devkit/verify.sh,本地钩子与 CI 跑的是同一个脚本(它自带生成物完整性校验)。
# e2e 与 soak 是分钟级手动档,绝不进 CI:入口只有本地的 verify.sh --with-e2e / --release,
# 见 moonbit/scripts/NEW-PROJECT.md 第十节。
on:
  push:
    branches: [main]
    # 发布 tag 同样过门禁:tag 推上去就等于对外宣告了一个版本,不能被跳过。
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 工具链与本地 WSL 版本一致;版本号只有一处(moonbit/scripts/devkit.conf)。
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        env:
          MOONBIT_INSTALL_VERSION: 0.10.17+d971670cd

      # 依赖按 moon.mod 缓存,改了依赖才重新拉取。
      - name: Cache moon registry
        uses: actions/cache@v4
        with:
          path: .mooncakes
          key: mooncakes-${{ hashFiles('moon.mod') }}
          restore-keys: mooncakes-

      - uses: oven-sh/setup-bun@v2
      - name: Verify
        run: bash scripts/devkit/verify.sh
