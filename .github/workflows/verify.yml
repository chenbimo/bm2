name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # moonbitlang/setup-moonbit does not exist; the official installer
      # script is the supported way. Only "latest" is downloadable:
      # dated version paths on the binary host return 403.
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - uses: oven-sh/setup-bun@v2

      - name: Run full verification
        run: bash scripts/verify.sh
