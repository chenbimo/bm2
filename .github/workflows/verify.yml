name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: moonbitlang/setup-moonbit@v1
        with:
          version: 0.1.20260803

      - uses: oven-sh/setup-bun@v2

      - name: Run full verification
        run: bash scripts/verify.sh
