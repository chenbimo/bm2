<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="bm2 架构与执行流程：外部请求经 Nginx 或 Caddy 进入，bm2 命令交给守护进程，守护进程拉起并监督应用实例，实例支持 cluster 共享端口与 fork 连续端口两种模式，日志落盘并推送事件">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c31"/>
    </linearGradient>
    <linearGradient id="daemonFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13253f"/>
      <stop offset="1" stop-color="#0d1a2f"/>
    </linearGradient>
    <marker id="mBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#34d399"/>
    </marker>
    <marker id="mViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#f87171"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="mPink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#f472b6"/>
    </marker>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; }
      .muted { fill: #9aa9bd; }
      .body { fill: #cfd9e6; }
      .title { fill: #edf2fa; font-weight: 600; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; }
      .chip { fill: #0e2033; stroke: #1e3a5f; }
      .pill { fill: #0b1220; stroke: #24334a; }
      .line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .breathe { animation: breathe 3.4s ease-in-out infinite; }
      .breathe2 { animation: breathe 3.4s ease-in-out 1.1s infinite; }
      .scan { stroke-dasharray: 140 880; animation: scan 7s linear infinite; }
      .dash { stroke-dasharray: 5 9; animation: dash 2.6s linear infinite; }
      @keyframes breathe { 0%,100% { opacity:.3; r:3.6 } 50% { opacity:1; r:5.6 } }
      @keyframes scan { to { stroke-dashoffset: -1020 } }
      @keyframes dash { to { stroke-dashoffset: -28 } }
      @media (prefers-reduced-motion: reduce) {
        .breathe, .breathe2, .scan, .dash { animation: none; }
      }
    </style>

    <path id="pCmd" d="M240 274 H316"/>
    <path id="pStart" d="M590 256 H600 Q612 256 612 246 V171 Q612 161 622 161 H636"/>
    <path id="pStart2" d="M612 266 V341 Q612 351 622 351 H636"/>
    <path id="pTraffic" d="M1002 256 H980 Q968 256 968 246 V171 Q968 161 956 161 H944"/>
    <path id="pTraffic2" d="M968 266 V341 Q968 351 956 351 H944"/>
    <path id="pRestart" d="M790 76 V54 Q790 44 780 44 H464 Q454 44 454 54 V70"/>
    <path id="pLog" d="M790 436 V446 Q790 454 782 454 H438 Q430 454 430 462 V466"/>
    <path id="pEvent" d="M590 532 H806"/>
    <path id="pOutside" d="M1107 40 V72"/>
  </defs>

  <rect x="0" y="0" width="1240" height="620" rx="22" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1238.5" height="618.5" rx="22" fill="none" stroke="#1e293b"/>

  <!-- 标题 -->
  <text class="t" x="48" y="52" font-size="26" font-weight="700">
    <tspan fill="#38bdf8">BM2</tspan><tspan fill="#edf2fa"> 部署 Node &amp; Bun 示意图</tspan>
  </text>

  <!-- 外部入口 -->
  <g>
    <rect class="pill" x="1047" y="8" width="120" height="32" rx="16"/>
    <text class="t body" x="1107" y="29" font-size="13" text-anchor="middle">用户 · 浏览器</text>
    <path class="line" d="M1107 40 V72" stroke="#a78bfa" marker-end="url(#mViolet)"/>
  </g>

  <!-- 命令 -->
  <g>
    <rect class="card" x="28" y="76" width="212" height="518" rx="14"/>
    <text class="t title" x="50" y="108" font-size="18">bm2 命令</text>
    <text class="t muted" x="50" y="132" font-size="12.5">你敲下的每一条</text>

    <text class="t mono" x="50" y="170" font-size="13" fill="#93c5fd">bm2 serve</text>
    <text class="t mono" x="50" y="198" font-size="13" fill="#93c5fd">bm2 dev</text>
    <text class="t mono" x="50" y="226" font-size="13" fill="#93c5fd">bm2 stop api</text>
    <text class="t mono" x="50" y="254" font-size="13" fill="#93c5fd">bm2 remove api</text>
    <text class="t mono" x="50" y="282" font-size="13" fill="#93c5fd">bm2 clean</text>
    <text class="t mono" x="50" y="310" font-size="13" fill="#93c5fd">bm2 kill -y</text>
    <text class="t mono" x="50" y="338" font-size="13" fill="#93c5fd">bm2 list</text>
    <text class="t mono" x="50" y="366" font-size="13" fill="#93c5fd">bm2 check</text>
    <text class="t mono" x="50" y="394" font-size="13" fill="#93c5fd">bm2 reload</text>
    <text class="t mono" x="50" y="422" font-size="13" fill="#93c5fd">bm2 notify</text>
    <text class="t mono" x="50" y="450" font-size="13" fill="#93c5fd">bm2 upgrade</text>
    <text class="t mono" x="50" y="478" font-size="13" fill="#93c5fd">bm2 version</text>

    <text class="t muted" x="50" y="522" font-size="12">本机 TCP + 令牌</text>
    <text class="t muted" x="50" y="546" font-size="12">改完配置重跑即生效</text>
  </g>

  <!-- 守护进程 -->
  <g>
    <rect x="322" y="76" width="268" height="360" rx="16" fill="url(#daemonFill)"/>
    <rect x="322" y="76" width="268" height="360" rx="16" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect class="scan" x="322" y="76" width="268" height="360" rx="16" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".75"/>

    <circle class="breathe" cx="346" cy="110" r="5" fill="#38bdf8" filter="url(#soft)"/>
    <text class="t title" x="360" y="116" font-size="18">bm2d 守护进程</text>

    <rect class="chip" x="340" y="142" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="162" font-size="12.5">监督循环 · 重启预算</text>

    <rect class="chip" x="340" y="178" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="198" font-size="12.5">崩溃重启 · 内存上限</text>

    <rect class="chip" x="340" y="214" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="234" font-size="12.5">优雅停止 · 宽限期</text>

    <rect class="chip" x="340" y="250" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="270" font-size="12.5">进程收养 · pidfd 绑定</text>

    <rect class="chip" x="340" y="286" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="306" font-size="12.5">端口互斥 · reusePort 探测</text>

    <rect class="chip" x="340" y="322" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="342" font-size="12.5">阈值巡检 · 内存与磁盘</text>

    <rect class="chip" x="340" y="358" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="378" font-size="12.5">日志轮转 · 保留代数</text>

    <rect class="chip" x="340" y="394" width="232" height="30" rx="8"/>
    <text class="t body" x="356" y="414" font-size="12.5">事件上报 · 七种渠道</text>
  </g>

  <!-- cluster 模式 -->
  <g>
    <rect class="card" x="640" y="76" width="300" height="170" rx="14"/>
    <text class="t title" x="664" y="106" font-size="16">cluster 模式</text>
    <rect x="782" y="90" width="48" height="22" rx="11" fill="#0e2033" stroke="#1e3a5f"/>
    <text class="t muted" x="806" y="105" font-size="11.5" text-anchor="middle">默认</text>
    <text class="t muted" x="664" y="132" font-size="12.5">实例共用 3000，内核分发</text>

    <rect x="664" y="162" width="112" height="58" rx="10" fill="#0b1a26" stroke="#14532d"/>
    <circle class="breathe2" cx="684" cy="184" r="4.2" fill="#34d399"/>
    <text class="t body" x="698" y="188" font-size="13">实例 0</text>
    <text class="t muted mono" x="698" y="208" font-size="12">:3000</text>

    <rect x="792" y="162" width="112" height="58" rx="10" fill="#0b1a26" stroke="#14532d"/>
    <circle class="breathe2" cx="812" cy="184" r="4.2" fill="#34d399"/>
    <text class="t body" x="826" y="188" font-size="13">实例 1</text>
    <text class="t muted mono" x="826" y="208" font-size="12">:3000</text>
  </g>

  <!-- fork 模式 -->
  <g>
    <rect class="card" x="640" y="266" width="300" height="170" rx="14"/>
    <text class="t title" x="664" y="296" font-size="16">fork 模式</text>
    <text class="t muted" x="664" y="322" font-size="12.5">端口从 3000 起连续排开</text>

    <rect x="664" y="352" width="112" height="58" rx="10" fill="#0b1a26" stroke="#14532d"/>
    <circle class="breathe2" cx="684" cy="374" r="4.2" fill="#34d399"/>
    <text class="t body" x="698" y="378" font-size="13">实例 0</text>
    <text class="t muted mono" x="698" y="398" font-size="12">:3000</text>

    <rect x="792" y="352" width="112" height="58" rx="10" fill="#0b1a26" stroke="#14532d"/>
    <circle class="breathe2" cx="812" cy="374" r="4.2" fill="#34d399"/>
    <text class="t body" x="826" y="378" font-size="13">实例 1</text>
    <text class="t muted mono" x="826" y="398" font-size="12">:3001</text>
  </g>

  <!-- 网关 -->
  <g>
    <rect class="card" x="1002" y="76" width="210" height="360" rx="14"/>
    <text class="t title" x="1024" y="136" font-size="15">Nginx · Caddy</text>
    <text class="t muted" x="1024" y="164" font-size="12.5">反向代理</text>
    <text class="t muted" x="1024" y="186" font-size="12.5">域名 · TLS</text>
    <line x1="1024" y1="204" x2="1188" y2="204" stroke="#1e293b"/>
    <text class="t muted" x="1024" y="230" font-size="12.5">只指向实例端口</text>
    <text class="t muted" x="1024" y="252" font-size="12.5">不管进程死活</text>
    <line x1="1024" y1="270" x2="1188" y2="270" stroke="#1e293b"/>
    <text class="t muted" x="1024" y="296" font-size="12.5">upstream 几条</text>
    <text class="t muted" x="1024" y="318" font-size="12.5">由模式决定</text>
    <line x1="1024" y1="336" x2="1188" y2="336" stroke="#1e293b"/>
    <text class="t muted" x="1024" y="362" font-size="12.5">进程托管</text>
    <text class="t muted" x="1024" y="384" font-size="12.5">归 bm2</text>
  </g>

  <!-- 状态与日志 -->
  <g>
    <rect class="card" x="322" y="470" width="268" height="124" rx="14"/>
    <text class="t title" x="346" y="500" font-size="15">状态与日志 ~/.bm2</text>
    <text class="t body" x="346" y="526" font-size="12.5">project.json · 实例状态</text>
    <text class="t body" x="346" y="550" font-size="12.5">out / error / crash</text>
    <text class="t muted" x="346" y="574" font-size="12">崩溃后仍能原地接管</text>
  </g>

  <!-- 通知 -->
  <g>
    <rect class="card" x="812" y="470" width="400" height="124" rx="14"/>
    <text class="t title" x="836" y="500" font-size="15">通知渠道</text>
    <text class="t body" x="836" y="526" font-size="12.5">飞书 · 钉钉 · 企业微信</text>
    <text class="t body" x="836" y="550" font-size="12.5">Slack · Discord · 邮件</text>
    <text class="t muted" x="1040" y="526" font-size="12.5">去重 · 限流 · 重试</text>
    <text class="t muted" x="1040" y="550" font-size="12.5">崩溃、阈值、体检</text>
  </g>

  <!-- 连线 -->
  <path class="line" d="M240 274 H316" stroke="#38bdf8" marker-end="url(#mBlue)"/>
  <path class="line" d="M590 256 H600 Q612 256 612 246 V171 Q612 161 622 161 H636" stroke="#34d399" marker-end="url(#mGreen)"/>
  <path class="line" d="M612 266 V341 Q612 351 622 351 H636" stroke="#34d399" marker-end="url(#mGreen)"/>
  <path class="line" d="M1002 256 H980 Q968 256 968 246 V171 Q968 161 956 161 H944" stroke="#a78bfa" marker-end="url(#mViolet)"/>
  <path class="line" d="M968 266 V341 Q968 351 956 351 H944" stroke="#a78bfa" marker-end="url(#mViolet)"/>
  <path class="line dash" d="M790 76 V54 Q790 44 780 44 H464 Q454 44 454 54 V70" stroke="#f87171" marker-end="url(#mRed)"/>
  <path class="line dash" d="M790 436 V446 Q790 454 782 454 H438 Q430 454 430 462 V466" stroke="#fbbf24" marker-end="url(#mAmber)"/>
  <path class="line" d="M590 532 H806" stroke="#f472b6" marker-end="url(#mPink)"/>

  <!-- 序号徽标 -->
  <g>
    <circle cx="278" cy="274" r="9.5" fill="#0b1220" stroke="#38bdf8" stroke-width="1.4"/>
    <text class="t" x="278" y="278" font-size="11" fill="#38bdf8" text-anchor="middle">1</text>

    <circle cx="612" cy="256" r="9.5" fill="#0b1220" stroke="#34d399" stroke-width="1.4"/>
    <text class="t" x="612" y="260" font-size="11" fill="#34d399" text-anchor="middle">2</text>

    <circle cx="968" cy="256" r="9.5" fill="#0b1220" stroke="#a78bfa" stroke-width="1.4"/>
    <text class="t" x="968" y="260" font-size="11" fill="#a78bfa" text-anchor="middle">3</text>

    <circle cx="600" cy="44" r="9.5" fill="#0b1220" stroke="#f87171" stroke-width="1.4"/>
    <text class="t" x="600" y="48" font-size="11" fill="#f87171" text-anchor="middle">4</text>

    <circle cx="560" cy="454" r="9.5" fill="#0b1220" stroke="#fbbf24" stroke-width="1.4"/>
    <text class="t" x="560" y="458" font-size="11" fill="#fbbf24" text-anchor="middle">5</text>

    <circle cx="698" cy="532" r="9.5" fill="#0b1220" stroke="#f472b6" stroke-width="1.4"/>
    <text class="t" x="698" y="536" font-size="11" fill="#f472b6" text-anchor="middle">6</text>
  </g>

  <!-- 流动的点 -->
  <circle r="4.6" fill="#38bdf8" opacity="0" filter="url(#soft)">
    <animateMotion dur="2.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pCmd" href="#pCmd"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.6" fill="#34d399" opacity="0" filter="url(#soft)">
    <animateMotion dur="3.6s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pStart" href="#pStart"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.2" fill="#34d399" opacity="0">
    <animateMotion dur="3.6s" begin="1.7s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pStart2" href="#pStart2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;0.2;0.8;1" dur="3.6s" begin="1.7s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.6" fill="#a78bfa" opacity="0" filter="url(#soft)">
    <animateMotion dur="3s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pTraffic" href="#pTraffic"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.2" fill="#a78bfa" opacity="0">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pTraffic2" href="#pTraffic2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;0.2;0.8;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.4" fill="#f87171" opacity="0">
    <animateMotion dur="5s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.18;0.82;1" keySplines="0 0 1 1;0.45 0 0.55 1;0 0 1 1">
      <mpath xlink:href="#pRestart" href="#pRestart"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.86;1" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.4" fill="#fbbf24" opacity="0">
    <animateMotion dur="4s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pLog" href="#pLog"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.2" fill="#f472b6" opacity="0">
    <animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pEvent" href="#pEvent"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <circle r="3.8" fill="#c4b5fd" opacity="0">
    <animateMotion dur="2.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1">
      <mpath xlink:href="#pOutside" href="#pOutside"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
