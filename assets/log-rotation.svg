<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="日志轮转：当前日志写满上限就整链后移一代，超出保留代数的最旧一份被删除">
  <defs>
    <marker id="mBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#f87171"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; }
      .muted { fill: #9aa9bd; }
      .body { fill: #cfd9e6; }
      .title { fill: #edf2fa; font-weight: 600; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; }
      .live { fill: #0e2033; stroke: #38bdf8; stroke-width: 1.8; }
      .line { fill: none; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="960" height="320" fill="#0b1220"/>

  <text class="t title" x="40" y="52" font-size="17">日志轮转</text>
  <text class="t muted" x="40" y="74" font-size="12.5">写满 log_max_size_mb 就整链后移一代，最旧的先走</text>

  <rect class="live" x="40" y="104" width="190" height="74" rx="10"/>
  <text class="t mono" x="135" y="134" font-size="13" text-anchor="middle" fill="#e2e8f0">api.log</text>
  <text class="t muted" x="135" y="156" font-size="11.5" text-anchor="middle">正在写，超过 10 MiB 就换</text>

  <path class="line" d="M230 141 H262" stroke="#38bdf8" marker-end="url(#mBlue)"/>
  <text class="t muted" x="246" y="128" font-size="11" text-anchor="middle">后移</text>

  <rect class="card" x="266" y="104" width="160" height="74" rx="10"/>
  <text class="t mono" x="346" y="134" font-size="13" text-anchor="middle" fill="#cbd5e1">api.1.log</text>
  <text class="t muted" x="346" y="156" font-size="11.5" text-anchor="middle">上一代</text>

  <path class="line" d="M426 141 H458" stroke="#38bdf8" marker-end="url(#mBlue)"/>

  <rect class="card" x="462" y="104" width="160" height="74" rx="10"/>
  <text class="t mono" x="542" y="134" font-size="13" text-anchor="middle" fill="#94a3b8">api.2.log</text>
  <text class="t muted" x="542" y="156" font-size="11.5" text-anchor="middle">更旧</text>

  <path class="line" d="M622 141 H654" stroke="#38bdf8" marker-end="url(#mBlue)"/>

  <text class="t mono" x="676" y="146" font-size="13" fill="#64748b">…</text>

  <rect class="card" x="712" y="104" width="180" height="74" rx="10" stroke="#7f1d1d"/>
  <text class="t mono" x="802" y="134" font-size="13" text-anchor="middle" fill="#fca5a5">api.10.log</text>
  <text class="t muted" x="802" y="156" font-size="11.5" text-anchor="middle">第 10 代，最旧</text>

  <path class="line" d="M892 141 H928" stroke="#f87171" marker-end="url(#mRed)"/>
  <text class="t" x="912" y="128" font-size="11" text-anchor="middle" fill="#f87171">删除</text>

  <text class="t muted" x="40" y="222" font-size="12">普通日志与错误日志各一条链，互不影响</text>
  <text class="t muted" x="40" y="246" font-size="12">默认 10 MiB × (10 代 + 当前) × 2 条链，单项目上限约 220 MB</text>
  <text class="t muted" x="40" y="270" font-size="12">log_keep_files = 0 时不留历史，只保留正在写的那份</text>
</svg>
